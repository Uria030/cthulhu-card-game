<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script src="admin-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOD-15 帳號管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-shared.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 1rem; }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .panel h2 { margin: 0 0 0.75rem; color: var(--gold); font-family: 'Cinzel', serif; font-size: 1rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .toolbar input, .form-row input, .form-row select, textarea {
      width: 100%; box-sizing: border-box; background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary); border-radius: 6px; padding: 0.55rem 0.7rem; font-family: 'Noto Sans TC', sans-serif;
    }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
    .form-row label { display: block; color: var(--text-secondary); font-size: 0.75rem; margin-bottom: 0.35rem; }
    .form-row-wide { grid-column: 1 / -1; }
    .password-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.5rem; align-items: stretch; }
    .password-tools .btn { min-width: 4.5rem; }
    .password-state { margin: 0.35rem 0 0; min-height: 1.2rem; }
    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .player-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 64vh; overflow-y: auto; }
    .player-card { text-align: left; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); padding: 0.75rem; cursor: pointer; }
    .player-card.active { border-color: var(--gold); box-shadow: 0 0 18px var(--gold-glow); }
    .player-line { display: flex; justify-content: space-between; gap: 0.5rem; }
    .mono { font-family: 'JetBrains Mono', monospace; color: var(--text-tertiary); font-size: 0.72rem; }
    .muted { color: var(--text-tertiary); font-size: 0.78rem; line-height: 1.5; }
    .save-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.75rem; }
    .save-card { border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; background: var(--bg-secondary); }
    .save-head { display: flex; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem; }
    textarea { min-height: 180px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; resize: vertical; }
    .danger { color: var(--danger); }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-row-wide { grid-column: auto; }
      .password-tools { grid-template-columns: minmax(0, 1fr) auto; }
      .password-tools #copyPasswordBtn { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <nav class="admin-nav">
    <a href="index.html" class="nav-title" style="text-decoration:none;color:var(--gold);">← 管理後台</a>
    <span style="flex:1"></span>
    <button onclick="adminLogout()" class="btn" style="font-size:0.75rem;padding:0.3rem 0.75rem;">登出</button>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>MOD-15 帳號管理</h1>
      <p>測試期玩家帳號、存檔格、死亡/退休履歷與調參入口。</p>
    </div>

    <div class="layout">
      <section class="panel">
        <h2>帳號列表</h2>
        <div class="toolbar">
          <input id="search" placeholder="搜尋 username / email">
          <button class="btn" id="reloadBtn">刷新</button>
        </div>
        <div id="playerList" class="player-list"></div>
      </section>

      <main class="panel">
        <h2>建帳號 / 編輯帳號</h2>
        <div class="form-grid">
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" autocomplete="off">
          </div>
          <div class="form-row">
            <label for="username">Username</label>
            <input id="username" autocomplete="off">
          </div>
          <div class="form-row">
            <label for="password">新密碼(建立時必填;編輯時空白=不改)</label>
            <input id="password" type="password" autocomplete="new-password">
          </div>
          <div class="form-row">
            <label for="saveSlots">存檔格上限</label>
            <input id="saveSlots" type="number" min="1" max="8" value="2">
          </div>
          <div class="form-row">
            <label for="disabled">狀態</label>
            <select id="disabled">
              <option value="false">啟用</option>
              <option value="true">停用</option>
            </select>
          </div>
          <div class="form-row form-row-wide">
            <label for="currentPassword">目前密碼</label>
            <div class="password-tools">
              <input id="currentPassword" type="password" readonly autocomplete="off" placeholder="選擇帳號後可顯示">
              <button class="btn" type="button" id="revealPasswordBtn" disabled aria-label="顯示目前密碼">顯示</button>
              <button class="btn" type="button" id="copyPasswordBtn" disabled aria-label="複製目前密碼">複製</button>
            </div>
            <p id="passwordState" class="muted password-state" aria-live="polite">尚未選擇帳號。</p>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="createBtn">建立帳號</button>
          <button class="btn" id="updateBtn" disabled>儲存變更</button>
          <button class="btn" id="clearBtn">清空表單</button>
        </div>
        <p id="status" class="muted" role="status" aria-live="polite"></p>

        <hr style="border-color:var(--border);margin:1rem 0;">

        <h2>存檔管理</h2>
        <div id="selectedSummary" class="muted">尚未選擇帳號。</div>
        <div id="saveGrid" class="save-grid" style="margin-top:0.75rem;"></div>
      </main>
    </div>
  </div>

  <script src="admin-shared.js"></script>
  <script>
    let players = [];
    let selectedPlayer = null;
    let revealedPassword = '';

    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function setStatus(text, danger) {
      el('status').textContent = text || '';
      el('status').className = danger ? 'muted danger' : 'muted';
    }

    async function loadPlayers() {
      if (revealedPassword) clearRevealedPassword(selectedPlayer?.player || null);
      const q = el('search').value.trim();
      const res = await adminFetch('/api/admin/players' + (q ? '?search=' + encodeURIComponent(q) : ''));
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '讀取失敗');
      players = data.data || [];
      renderPlayers();
    }

    function renderPlayers() {
      el('playerList').innerHTML = players.map(p => `
        <button class="player-card ${selectedPlayer && selectedPlayer.player.id === p.id ? 'active' : ''}" data-id="${esc(p.id)}">
          <div class="player-line"><strong>${esc(p.username)}</strong><span class="${p.is_disabled ? 'danger' : 'mono'}">${p.is_disabled ? '停用' : 'active ' + Number(p.active_save_count || 0)}</span></div>
          <div class="mono">${esc(p.email)}</div>
          <div class="muted">已故 ${Number(p.dead_count || 0)} · 退休 ${Number(p.retired_count || 0)} · 格數 ${Number(p.save_slots_max || 2)}</div>
        </button>
      `).join('');
      document.querySelectorAll('.player-card').forEach(btn => btn.addEventListener('click', () => selectPlayer(btn.dataset.id)));
    }

    function fillForm(player) {
      el('email').value = player?.email || '';
      el('username').value = player?.username || '';
      el('password').value = '';
      el('saveSlots').value = player?.save_slots_max || 2;
      el('disabled').value = player?.is_disabled ? 'true' : 'false';
      el('updateBtn').disabled = !player;
      clearRevealedPassword(player);
    }

    function clearRevealedPassword(player) {
      revealedPassword = '';
      el('currentPassword').value = '';
      el('currentPassword').type = 'password';
      el('revealPasswordBtn').textContent = '顯示';
      el('revealPasswordBtn').setAttribute('aria-label', '顯示目前密碼');
      el('copyPasswordBtn').disabled = true;
      if (!player) {
        el('revealPasswordBtn').disabled = true;
        el('passwordState').textContent = '尚未選擇帳號。';
      } else if (player.has_recoverable_password) {
        el('revealPasswordBtn').disabled = false;
        el('passwordState').textContent = '目前密碼已加密保管，按顯示後讀取。';
      } else {
        el('revealPasswordBtn').disabled = true;
        el('passwordState').textContent = '舊密碼未納入保管，請在上方設定新密碼。';
      }
    }

    async function toggleCurrentPassword() {
      if (!selectedPlayer) return;
      if (revealedPassword) {
        const shouldShow = el('currentPassword').type === 'password';
        el('currentPassword').type = shouldShow ? 'text' : 'password';
        el('revealPasswordBtn').textContent = shouldShow ? '隱藏' : '顯示';
        el('revealPasswordBtn').setAttribute('aria-label', shouldShow ? '隱藏目前密碼' : '顯示目前密碼');
        return;
      }

      const button = el('revealPasswordBtn');
      button.disabled = true;
      el('passwordState').textContent = '正在讀取目前密碼...';
      try {
        const res = await adminFetch('/api/admin/players/' + encodeURIComponent(selectedPlayer.player.id) + '/password/reveal', {
          method: 'POST'
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '讀取目前密碼失敗');
        revealedPassword = String(data.data?.password || '');
        el('currentPassword').value = revealedPassword;
        el('currentPassword').type = 'text';
        button.textContent = '隱藏';
        button.setAttribute('aria-label', '隱藏目前密碼');
        el('copyPasswordBtn').disabled = !revealedPassword;
        el('passwordState').textContent = '目前密碼已顯示；離開此帳號後會自動清除。';
      } catch (error) {
        clearRevealedPassword(selectedPlayer.player);
        setStatus(error.message || '讀取目前密碼失敗', true);
      } finally {
        button.disabled = !selectedPlayer?.player?.has_recoverable_password;
      }
    }

    async function copyCurrentPassword() {
      if (!revealedPassword) return;
      try {
        await navigator.clipboard.writeText(revealedPassword);
      } catch {
        const copySource = document.createElement('textarea');
        copySource.value = revealedPassword;
        copySource.setAttribute('readonly', '');
        copySource.style.position = 'fixed';
        copySource.style.opacity = '0';
        document.body.appendChild(copySource);
        copySource.select();
        document.execCommand('copy');
        copySource.remove();
      }
      el('passwordState').textContent = '目前密碼已複製。';
    }

    async function selectPlayer(id) {
      clearRevealedPassword(null);
      const res = await adminFetch('/api/admin/players/' + encodeURIComponent(id) + '/saves');
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '讀取帳號失敗');
      selectedPlayer = data.data;
      fillForm(selectedPlayer.player);
      renderPlayers();
      renderSaves();
    }

    function renderSaves() {
      if (!selectedPlayer) {
        el('selectedSummary').textContent = '尚未選擇帳號。';
        el('saveGrid').innerHTML = '';
        return;
      }
      const p = selectedPlayer.player;
      el('selectedSummary').textContent = `${p.username} · ${p.email} · 已故 ${p.dead_count} · 退休 ${p.retired_count}`;
      const saves = selectedPlayer.saves || [];
      if (saves.length === 0) {
        el('saveGrid').innerHTML = '<div class="muted">此帳號尚無存檔。</div>';
        return;
      }
      el('saveGrid').innerHTML = saves.map(s => `
        <article class="save-card" data-save="${esc(s.id)}">
          <div class="save-head">
            <strong>Slot ${Number(s.slot)} · ${esc(s.title_zh || s.name_zh || s.mbti_code)}</strong>
            <span class="mono">${esc(s.status)}</span>
          </div>
          <div class="muted">${esc(s.campaign_name || '未進戰役')} · ${esc(s.updated_at || '')}</div>
          <div class="form-row" style="margin-top:0.5rem;">
            <label>Status</label>
            <select class="save-status">
              ${['active','retired','dead'].map(v => `<option value="${v}" ${s.status === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <div class="form-row" style="margin-top:0.5rem;">
            <label>CampaignProgress JSON</label>
            <textarea class="save-progress">${esc(JSON.stringify(s.campaign_progress || {}, null, 2))}</textarea>
          </div>
          <div class="btn-row">
            <button class="btn save-update">儲存存檔</button>
          </div>
        </article>
      `).join('');
      document.querySelectorAll('.save-card').forEach(card => {
        card.querySelector('.save-update').addEventListener('click', () => updateSave(card));
      });
    }

    async function updateSave(card) {
      const id = card.dataset.save;
      let progress;
      try {
        progress = JSON.parse(card.querySelector('.save-progress').value || '{}');
      } catch {
        setStatus('CampaignProgress JSON 格式錯誤', true);
        return;
      }
      const res = await adminFetch('/api/admin/player-saves/' + encodeURIComponent(id), {
        method: 'PATCH',
        body: JSON.stringify({
          status: card.querySelector('.save-status').value,
          campaign_progress: progress
        })
      });
      const data = await res.json();
      if (!data.success) {
        setStatus(data.error || '更新存檔失敗', true);
        return;
      }
      setStatus('存檔已更新');
      await selectPlayer(selectedPlayer.player.id);
    }

    async function createPlayer() {
      const body = {
        email: el('email').value.trim(),
        username: el('username').value.trim(),
        password: el('password').value,
        save_slots_max: Number(el('saveSlots').value || 2)
      };
      const res = await adminFetch('/api/admin/players', { method: 'POST', body: JSON.stringify(body) });
      const data = await res.json();
      if (!data.success) {
        setStatus(data.error || '建立失敗', true);
        return;
      }
      setStatus('帳號已建立');
      await loadPlayers();
      await selectPlayer(data.data.id);
    }

    async function updatePlayer() {
      if (!selectedPlayer) return;
      const body = {
        email: el('email').value.trim(),
        username: el('username').value.trim(),
        save_slots_max: Number(el('saveSlots').value || 2),
        is_disabled: el('disabled').value === 'true'
      };
      if (el('password').value) body.password = el('password').value;
      const res = await adminFetch('/api/admin/players/' + encodeURIComponent(selectedPlayer.player.id), {
        method: 'PATCH',
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!data.success) {
        setStatus(data.error || '更新失敗', true);
        return;
      }
      setStatus('帳號已更新');
      await loadPlayers();
      await selectPlayer(selectedPlayer.player.id);
    }

    el('reloadBtn').addEventListener('click', () => loadPlayers().catch(e => setStatus(e.message, true)));
    el('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadPlayers().catch(err => setStatus(err.message, true)); });
    el('createBtn').addEventListener('click', () => createPlayer().catch(e => setStatus(e.message, true)));
    el('updateBtn').addEventListener('click', () => updatePlayer().catch(e => setStatus(e.message, true)));
    el('clearBtn').addEventListener('click', () => { selectedPlayer = null; fillForm(null); renderPlayers(); renderSaves(); setStatus(''); });
    el('revealPasswordBtn').addEventListener('click', () => toggleCurrentPassword().catch(e => setStatus(e.message, true)));
    el('copyPasswordBtn').addEventListener('click', () => copyCurrentPassword().catch(e => setStatus(e.message, true)));
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && revealedPassword) clearRevealedPassword(selectedPlayer?.player || null);
    });

    loadPlayers().catch(e => setStatus(e.message, true));
  </script>
</body>
</html>
